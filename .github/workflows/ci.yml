name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint security-sensitive files
        run: bunx eslint src/hooks/use-auth.tsx src/lib/blux.functions.ts src/routes/ops-fe0286eca1e960bb557cdef0976fa9a2.tsx src/routes/auth.tsx src/routes/verify.tsx
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
